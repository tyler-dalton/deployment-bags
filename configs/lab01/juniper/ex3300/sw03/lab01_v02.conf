### BG02-SW03 - Junos 12.x (non-ELS) set-format config
### Load from configuration mode with:  load set terminal   (paste, then Ctrl+D)
### Then:  show | compare  ->  commit check  ->  commit confirmed 5  ->  commit
### ---------- Base ----------
set system host-name BG02-SW03
set system domain-name dep-bags.local
set system root-authentication encrypted-password "$1$6m5ZnS0E$.Kg3R.o9Cnq0KJLD7jMSV0"
delete system services web-management
### ---------- Users ----------
# Junos can't rename or remove root, so "ta" is added as a super-user
# with the same password hash as root.
set system login user ta class super-user
set system login user ta authentication encrypted-password "$1$6m5ZnS0E$.Kg3R.o9Cnq0KJLD7jMSV0"
### ---------- VLANs / management ----------
# Built-in default VLAN (ID 1) is the student/management VLAN
set vlans default description "STUDENT-DEFAULT"
set vlans default vlan-id 1
set vlans default l3-interface vlan.1
set vlans BRICKED-PORTS vlan-id 999
# Non-ELS Junos uses the "vlan" interface, not "irb"
delete interfaces vlan
set interfaces vlan unit 1 description "LAB-MANAGEMENT"
set interfaces vlan unit 1 family inet address 10.0.0.1/24
### ---------- Student ports: ge-0/0/0-3, 10-13, 20-23 (1-4, 11-14, 21-24)----------
set interfaces interface-range LAB-STUDENT member-range ge-0/0/0 to ge-0/0/3
set interfaces interface-range LAB-STUDENT member-range ge-0/0/10 to ge-0/0/13
set interfaces interface-range LAB-STUDENT member-range ge-0/0/20 to ge-0/0/23
set interfaces interface-range LAB-STUDENT description "LAB-STUDENT"
set interfaces interface-range LAB-STUDENT unit 0 family ethernet-switching port-mode access
set interfaces interface-range LAB-STUDENT unit 0 family ethernet-switching vlan members default
# One fixed MAC per port
set ethernet-switching-options secure-access-port interface ge-0/0/0  allowed-mac 90:2E:16:1D:E7:6C
set ethernet-switching-options secure-access-port interface ge-0/0/1  allowed-mac 90:2E:16:1D:EA:A2
set ethernet-switching-options secure-access-port interface ge-0/0/2  allowed-mac 90:2E:16:1F:DE:B7
set ethernet-switching-options secure-access-port interface ge-0/0/3  allowed-mac 90:2E:16:1F:E8:DF
set ethernet-switching-options secure-access-port interface ge-0/0/10 allowed-mac 90:2E:16:1F:E0:B9
set ethernet-switching-options secure-access-port interface ge-0/0/11 allowed-mac 90:2E:16:1D:EC:4A
set ethernet-switching-options secure-access-port interface ge-0/0/12 allowed-mac 90:2E:16:1F:DF:B9
set ethernet-switching-options secure-access-port interface ge-0/0/13 allowed-mac 90:2E:16:1F:E8:3B
set ethernet-switching-options secure-access-port interface ge-0/0/20 allowed-mac 90:2E:16:1F:E3:49
set ethernet-switching-options secure-access-port interface ge-0/0/21 allowed-mac 90:2E:16:1F:DF:45
set ethernet-switching-options secure-access-port interface ge-0/0/22 allowed-mac 90:2E:16:1F:E1:2B
set ethernet-switching-options secure-access-port interface ge-0/0/23 allowed-mac 90:2E:16:1D:E7:68
# Limit 1, drop and log violations (Cisco "violation restrict" equivalent)
# If your release rejects drop-and-log, change it back to "drop"
set ethernet-switching-options secure-access-port interface ge-0/0/0  mac-limit 1 action drop
set ethernet-switching-options secure-access-port interface ge-0/0/1  mac-limit 1 action drop
set ethernet-switching-options secure-access-port interface ge-0/0/2  mac-limit 1 action drop
set ethernet-switching-options secure-access-port interface ge-0/0/3  mac-limit 1 action drop
set ethernet-switching-options secure-access-port interface ge-0/0/10 mac-limit 1 action drop
set ethernet-switching-options secure-access-port interface ge-0/0/11 mac-limit 1 action drop
set ethernet-switching-options secure-access-port interface ge-0/0/12 mac-limit 1 action drop
set ethernet-switching-options secure-access-port interface ge-0/0/13 mac-limit 1 action drop
set ethernet-switching-options secure-access-port interface ge-0/0/20 mac-limit 1 action drop
set ethernet-switching-options secure-access-port interface ge-0/0/21 mac-limit 1 action drop
set ethernet-switching-options secure-access-port interface ge-0/0/22 mac-limit 1 action drop
set ethernet-switching-options secure-access-port interface ge-0/0/23 mac-limit 1 action drop
# PortFast equivalent
set protocols rstp interface ge-0/0/0  edge
set protocols rstp interface ge-0/0/1  edge
set protocols rstp interface ge-0/0/2  edge
set protocols rstp interface ge-0/0/3  edge
set protocols rstp interface ge-0/0/10 edge
set protocols rstp interface ge-0/0/11 edge
set protocols rstp interface ge-0/0/12 edge
set protocols rstp interface ge-0/0/13 edge
set protocols rstp interface ge-0/0/20 edge
set protocols rstp interface ge-0/0/21 edge
set protocols rstp interface ge-0/0/22 edge
set protocols rstp interface ge-0/0/23 edge
### ---------- ge-0/0/4 (physical port 5): GAME SERVER, 6 allowed MACs ----------
set interfaces ge-0/0/4 description "LAB-GAME-SERVER"
set interfaces ge-0/0/4 unit 0 family ethernet-switching port-mode access
set interfaces ge-0/0/4 unit 0 family ethernet-switching vlan members default
set ethernet-switching-options secure-access-port interface ge-0/0/4 allowed-mac 2c:cf:67:e3:55:33
set ethernet-switching-options secure-access-port interface ge-0/0/4 allowed-mac 2c:cf:67:e2:e5:bb
set ethernet-switching-options secure-access-port interface ge-0/0/4 allowed-mac 2c:cf:67:e3:4a:8d
set ethernet-switching-options secure-access-port interface ge-0/0/4 allowed-mac 2c:cf:67:e3:52:f5
set ethernet-switching-options secure-access-port interface ge-0/0/4 allowed-mac 2c:cf:67:e2:e6:19
set ethernet-switching-options secure-access-port interface ge-0/0/4 allowed-mac 2c:cf:67:e2:e4:87
# Cap at 6, drop and log anything else
set ethernet-switching-options secure-access-port interface ge-0/0/4 mac-limit 6 action drop
set protocols rstp interface ge-0/0/4 edge
### ---------- ge-0/0/19 (physical port 20): TA management, 4 allowed MACs ----------
set interfaces ge-0/0/19 description "LAB-TA-MANAGEMENT"
set interfaces ge-0/0/19 unit 0 family ethernet-switching port-mode access
set interfaces ge-0/0/19 unit 0 family ethernet-switching vlan members default
set ethernet-switching-options secure-access-port interface ge-0/0/19 allowed-mac 50:7b:9d:6b:4d:04
set ethernet-switching-options secure-access-port interface ge-0/0/19 allowed-mac 00:e0:4c:68:12:86
set ethernet-switching-options secure-access-port interface ge-0/0/19 allowed-mac c0:b5:d7:b2:08:4e
set ethernet-switching-options secure-access-port interface ge-0/0/19 allowed-mac 6C:6E:07:2E:B4:F4
set ethernet-switching-options secure-access-port interface ge-0/0/19 mac-limit 4 action drop
set protocols rstp interface ge-0/0/19 edge
### ---------- Bricked ports: ge-0/0/5-9, 14-18 ----------
set interfaces interface-range LAB-BRICKED-A member-range ge-0/0/5 to ge-0/0/9
set interfaces interface-range LAB-BRICKED-B member-range ge-0/0/14 to ge-0/0/18
set interfaces interface-range LAB-BRICKED-A description "LAB-BRICKED"
set interfaces interface-range LAB-BRICKED-B description "LAB-BRICKED"
set interfaces interface-range LAB-BRICKED-A unit 0 family ethernet-switching port-mode access
set interfaces interface-range LAB-BRICKED-B unit 0 family ethernet-switching port-mode access
set interfaces interface-range LAB-BRICKED-A unit 0 family ethernet-switching vlan members BRICKED-PORTS
set interfaces interface-range LAB-BRICKED-B unit 0 family ethernet-switching vlan members BRICKED-PORTS
set interfaces interface-range LAB-BRICKED-A disable
set interfaces interface-range LAB-BRICKED-B disable