set system host-name BG02-SW03
set system domain-name dep-bags.local
set system login retry-options tries-before-disconnect 3
set system login class TA-ADMIN idle-timeout 10
set system login class TA-ADMIN permissions all
set system login user ta uid 2000
set system login user ta class TA-ADMIN
set system services ssh root-login deny
set system services ssh protocol-version v2
set system services ssh connection-limit 5
set system services dhcp traceoptions file dhcp_logfile
set system services dhcp traceoptions level all
set system services dhcp traceoptions flag all
set system syslog user * any emergency
set system syslog file messages any notice
set system syslog file messages authorization info
set system syslog file interactive-commands interactive-commands any
set chassis auto-image-upgrade

set interfaces interface-range STUDENTS member-range ge-0/0/0 to ge-0/0/2
set interfaces interface-range STUDENTS description LAB01-STUDENT
set interfaces interface-range STUDENTS unit 0 family ethernet-switching port-mode access
set interfaces interface-range STUDENTS unit 0 family ethernet-switching vlan members default
set interfaces interface-range UNUSED-PORTS member-range ge-0/0/3 to ge-0/0/21
set interfaces interface-range UNUSED-PORTS description ADMIN-DOWN
set interfaces interface-range UNUSED-PORTS disable
set interfaces interface-range UNUSED-PORTS unit 0 family ethernet-switching port-mode access
set interfaces interface-range UNUSED-PORTS unit 0 family ethernet-switching vlan members BRICK
set interfaces ge-0/0/0 unit 0 family ethernet-switching
set interfaces ge-0/0/1 unit 0 family ethernet-switching
set interfaces ge-0/0/2 unit 0 family ethernet-switching
set interfaces ge-0/0/22 description TA-MAN
set interfaces ge-0/0/22 unit 0 family ethernet-switching port-mode access
set interfaces ge-0/0/22 unit 0 family ethernet-switching vlan members default
set interfaces ge-0/0/23 description LAB01-GAME-SERV
set interfaces ge-0/0/23 unit 0 family ethernet-switching port-mode access
set interfaces ge-0/0/23 unit 0 family ethernet-switching vlan members default

set interfaces ge-0/1/0 unit 0 disable
set interfaces ge-0/1/0 unit 0 description ADMIN-DOWN
set interfaces ge-0/1/0 unit 0 family ethernet-switching
set interfaces xe-0/1/0 unit 0 family ethernet-switching
set interfaces ge-0/1/1 unit 0 disable
set interfaces ge-0/1/1 unit 0 description ADMIN-DOWN
set interfaces ge-0/1/1 unit 0 family ethernet-switching
set interfaces xe-0/1/1 unit 0 family ethernet-switching
set interfaces ge-0/1/2 unit 0 family ethernet-switching
set interfaces xe-0/1/2 unit 0 family ethernet-switching
set interfaces ge-0/1/3 unit 0 family ethernet-switching
set interfaces xe-0/1/3 unit 0 family ethernet-switching
set interfaces lo0 unit 0 family inet filter input RE-PROTECT
set interfaces me0 unit 0 family inet dhcp vendor-id Juniper-ex3300-24p
set interfaces vlan unit 0 description LAB01-MAN
set interfaces vlan unit 0 family inet address 10.0.0.1/24
set protocols igmp-snooping vlan all
set protocols rstp interface ge-0/0/0.0 edge
set protocols rstp interface ge-0/0/1.0 edge
set protocols rstp interface ge-0/0/2.0 edge
set protocols rstp interface ge-0/0/22.0 edge
set protocols rstp interface ge-0/0/23.0 edge
set protocols rstp bpdu-block-on-edge
set protocols lldp interface all
set protocols lldp-med interface all
set firewall family inet filter RE-PROTECT term ALLOW-TA-SSH from source-address 10.0.0.250/32
set firewall family inet filter RE-PROTECT term ALLOW-TA-SSH from protocol tcp
set firewall family inet filter RE-PROTECT term ALLOW-TA-SSH from destination-port ssh
set firewall family inet filter RE-PROTECT term ALLOW-TA-SSH then accept
set firewall family inet filter RE-PROTECT term DENY-OTHER-SSH from protocol tcp
set firewall family inet filter RE-PROTECT term DENY-OTHER-SSH from destination-port ssh
set firewall family inet filter RE-PROTECT term DENY-OTHER-SSH then discard
set firewall family inet filter RE-PROTECT term ALLOW-OTHER then accept
set ethernet-switching-options secure-access-port interface ge-0/0/0.0 mac-limit 1
set ethernet-switching-options secure-access-port interface ge-0/0/0.0 mac-limit action drop
set ethernet-switching-options secure-access-port interface ge-0/0/0.0 allowed-mac <STUDENT_MAC_01>
set ethernet-switching-options secure-access-port interface ge-0/0/1.0 mac-limit 1
set ethernet-switching-options secure-access-port interface ge-0/0/1.0 mac-limit action drop
set ethernet-switching-options secure-access-port interface ge-0/0/1.0 allowed-mac <STUDENT_MAC_02>
set ethernet-switching-options secure-access-port interface ge-0/0/2.0 mac-limit 1
set ethernet-switching-options secure-access-port interface ge-0/0/2.0 mac-limit action drop
set ethernet-switching-options secure-access-port interface ge-0/0/2.0 allowed-mac <STUDENT_MAC_03>
set ethernet-switching-options secure-access-port interface ge-0/0/22.0 mac-limit 4
set ethernet-switching-options secure-access-port interface ge-0/0/22.0 mac-limit action drop
set ethernet-switching-options secure-access-port interface ge-0/0/22.0 allowed-mac <TA_MAC_01>
set ethernet-switching-options secure-access-port interface ge-0/0/22.0 allowed-mac <TA_MAC_02>
set ethernet-switching-options secure-access-port interface ge-0/0/22.0 allowed-mac <TA_MAC_03>
set ethernet-switching-options secure-access-port interface ge-0/0/22.0 allowed-mac <TA_MAC_04>
set ethernet-switching-options storm-control interface all
set vlans BRICK vlan-id 999
set vlans default l3-interface vlan.0
set poe interface all
