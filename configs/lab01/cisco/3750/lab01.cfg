!
! Lab 01 baseline - Cisco Catalyst 3750 / BG01-SW01
! Sanitized template. Replace credential and MAC placeholders before deployment.
!
hostname BG01-SW01
no ip http server
no ip http secure-server
no ip routing
!
vlan 1
 name STUDENT-DEFAULT
vlan 999
 name BRICKED-PORTS
!
interface range FastEthernet1/0/1 - 3
 description LAB01-STUDENT
 switchport mode access
 switchport access vlan 1
 spanning-tree portfast
!
interface range FastEthernet1/0/4 - 22
 description LAB01-BRICKED
 switchport mode access
 switchport access vlan 999
 shutdown
!
interface FastEthernet1/0/23
 description LAB01-TA-MANAGEMENT
 switchport mode access
 switchport access vlan 1
 switchport port-security
 switchport port-security maximum 4
 switchport port-security violation restrict
 switchport port-security mac-address <TA_MAC_01>
 switchport port-security mac-address <TA_MAC_02>
 switchport port-security mac-address <TA_MAC_03>
 switchport port-security mac-address <TA_MAC_04>
!
interface FastEthernet1/0/24
 description LAB01-GAME-SERVER
 switchport mode access
 switchport access vlan 1
!
interface Vlan1
 description LAB01-MANAGEMENT
 ip address 10.0.0.1 255.255.255.0
 no shutdown
!
end
