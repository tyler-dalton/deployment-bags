! SANITIZED CONFIGURATION TEMPLATE
! Replace credential and MAC placeholders before deployment.
! Lab 01 uses VLAN 1 for students, TA management, and the game server.
! The separate management VLAN is intentionally omitted.
!
version 12.2
no service pad
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname BG01-SW01
!
boot-start-marker
boot-end-marker
!
enable secret <ENABLE_SECRET>
username ta privilege 15 secret <TA_SECRET>
no aaa new-model
switch 1 provision ws-c3750-24p
system mtu routing 1500
ip domain-name dep-bags.local
!
no ip http server
no ip http secure-server
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!
spanning-tree mode pvst
spanning-tree extend system-id
!
vlan 999
 name BRICK
!
interface range FastEthernet1/0/1 - 3
 description LAB01-STUDENT
 switchport mode access
 switchport nonegotiate
 spanning-tree portfast
 spanning-tree bpduguard enable
 switchport port-security
 switchport port-security maximum 1
 switchport port-security violation restrict
!
interface FastEthernet1/0/1
 switchport port-security mac-address <STUDENT_MAC_01>
!
interface FastEthernet1/0/2
 switchport port-security mac-address <STUDENT_MAC_02>
!
interface FastEthernet1/0/3
 switchport port-security mac-address <STUDENT_MAC_03>
!
interface range FastEthernet1/0/4 - 22
 description ADMIN-DOWN
 switchport access vlan 999
 switchport mode access
 shutdown
!
interface FastEthernet1/0/23
 description TA-MAN
 switchport mode access
 switchport nonegotiate
 spanning-tree portfast
 spanning-tree bpduguard enable
 switchport port-security
 switchport port-security maximum 3
 switchport port-security violation restrict
 switchport port-security mac-address <MAC_01>
 switchport port-security mac-address <MAC_02>
 switchport port-security mac-address <MAC_03>
!
interface FastEthernet1/0/24
 description LAB01-GAME-SERV
 switchport mode access
 switchport nonegotiate
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface range GigabitEthernet1/0/1 - 2
 description ADMIN-DOWN
 switchport access vlan 999
 switchport mode access
 shutdown
!
interface Vlan1
 description LAB01-MAN
 ip address 10.0.0.1 255.255.255.0
 no shutdown
!
access-list 10 remark AUTH-TA-SSH
access-list 10 permit host 10.0.0.250
!
line con 0
!
line vty 0 4
 access-class 10 in
 login local
 transport input ssh
 exec-timeout 10 0
!
line vty 5 15
 access-class 10 in
 login local
 transport input ssh
 exec-timeout 10 0
!
end
